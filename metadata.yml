Title: AntibioticDB similarity matches matches
Description: Counts how many compounds in AntibioticDB resemble a query at several
  Tanimoto thresholds, and separately judges whether its scaffold looks antibiotic-like.
  AntibioticDB was assembled by Farrell and colleagues to gather antibacterial agents
  including those abandoned mid-development, so matches can surface precedent that
  never reached the literature as approved drugs. Searches run against both the full
  database and a manually curated subset, giving a stricter comparison alongside the
  broad one.
