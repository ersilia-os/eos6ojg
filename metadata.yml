Title: AntibioticDB similarity matches matches
Description: Compares a query against AntibioticDB, the open database set up by Farrell
  and colleagues and now hosted by GARDP, which records antibacterials in clinical
  and pre-clinical development alongside 834 discontinued agents, so a match can surface
  precedent that never reached the market. Ersilia built the search, counting compounds
  above Tanimoto cut-offs from 0.3 to 1.0 on Morgan fingerprints across the full database
  and a manually curated subset of 254, and adding a naive Bayes classifier that calls
  the Murcko and BRICS scaffolds of the query antibiotic-like or not.
